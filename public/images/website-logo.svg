<svg viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="8" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- 3D effect - gray shadows (behind) -->
  <g fill="#808080">
    <!-- MAN shadow -->
    <text x="58" y="148" font-family="Arial, sans-serif" font-size="120" font-weight="900" fill="#808080">MAN</text>
    
    <!-- AI shadow -->
    <text x="448" y="148" font-family="Arial, sans-serif" font-size="120" font-weight="900" fill="#808080">AI</text>
  </g>
  
  <!-- MAN text (white foreground) -->
  <g>
    <text x="50" y="140" font-family="Arial, sans-serif" font-size="120" font-weight="900" fill="#ffffff">MAN</text>
  </g>
  
  <!-- AI text (white foreground) -->
  <g>
    <text x="440" y="140" font-family="Arial, sans-serif" font-size="120" font-weight="900" fill="#ffffff">AI</text>
  </g>
  
  <!-- VS shadow (gray, positioned to overlap both MAN and AI) -->
  <g>
    <text x="353" y="118" font-family="Arial, sans-serif" font-size="60" font-weight="900" fill="#808080">VS</text>
  </g>
  
  <!-- VS text (white foreground, in front of everything) -->
  <g>
    <text x="345" y="110" font-family="Arial, sans-serif" font-size="60" font-weight="900" fill="#ffffff">VS</text>
  </g>
</svg>