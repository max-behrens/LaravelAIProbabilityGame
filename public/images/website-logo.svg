<svg viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="8" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- 3D effect - gray shadows (behind) -->
  <g fill="#808080">
    <!-- MAN shadow -->
    <text x="58" y="148" font-family="Arial, sans-serif" font-size="120" font-weight="900" fill="#808080">MAN</text>
    
    <!-- AI shadow -->
    <text x="468" y="148" font-family="Arial, sans-serif" font-size="120" font-weight="900" fill="#808080">AI</text>
  </g>
  
  <!-- MAN text (white foreground with stroke) -->
  <g>
    <text 
      x="50" y="140" 
      font-family="Arial, sans-serif" 
      font-size="120" 
      font-weight="900" 
      fill="#ffffff" 
      stroke="#111827" 
      stroke-width="3"
    >MAN</text>
  </g>
  
  <!-- AI text (white foreground with stroke) -->
  <g>
    <text 
      x="460" y="140" 
      font-family="Arial, sans-serif" 
      font-size="120" 
      font-weight="900" 
      fill="#f7dcdc" 
      stroke="#111827" 
      stroke-width="3"
    >AI</text>
  </g>
  
  <!-- VS shadow -->
  <g>
    <text x="370" y="118" font-family="Arial, sans-serif" font-size="60" font-weight="900" fill="#808080">VS</text>
  </g>
  
  <!-- VS text (white foreground with stroke) -->
  <g>
    <text 
      x="362" y="110" 
      font-family="Arial, sans-serif" 
      font-size="60" 
      font-weight="900" 
      fill="#ffffff" 
      stroke="#111827" 
      stroke-width="2"
    >VS</text>
  </g>
</svg>
